<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="violetCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#DCCBFF"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="78%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#16002E"/>
    </radialGradient>

    <linearGradient id="crescentDark" x1="180" y1="120" x2="830" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C0B42"/>
      <stop offset="35%" stop-color="#3B0D8A"/>
      <stop offset="60%" stop-color="#12001F"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="crescentEdge" x1="170" y1="140" x2="830" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9DDFF"/>
      <stop offset="35%" stop-color="#9B6DFF"/>
      <stop offset="70%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.55 0 0 0 0.38
                0 0.20 0 0 0.05
                0 0 1.00 0 0.95
                0 0 0 0.9 0" result="violetBlur"/>
      <feMerge>
        <feMergeNode in="violetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="microGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background. Add a white rect if needed:
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  -->

  <!-- Outer refined C crescent -->
  <path
    d="M755.5 180.8
       C627.7 99.6 456.7 102.1 326.1 190.4
       C172.4 294.4 105.4 487.3 160.4 663.9
       C216.8 844.6 387.7 944.7 563.9 916.3
       C657.1 901.3 739.9 852.8 797.7 783.3
       C818.5 758.3 785.4 725.3 760.2 745.6
       C708.3 787.4 644.8 813.2 574.1 821.7
       C437.5 838.1 307.4 759.2 258.4 629.5
       C210.3 502.1 252.4 353.9 363.7 274.7
       C476.3 194.6 621.9 185.3 737.2 248.8
       C769.9 266.8 787.6 201.1 755.5 180.8Z"
    fill="url(#crescentDark)"
    stroke="url(#crescentEdge)"
    stroke-width="10"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Inner cut/glass highlight to make the C lighter and more elegant -->
  <path
    d="M699.5 244.6
       C590.2 194.6 457.7 205.4 360.7 276.1
       C257.6 351.2 217.8 488.8 260.7 609.4
       C303.7 730.1 423.8 804.7 550.8 792.7
       C616.6 786.5 677.7 761.5 728.6 722.6"
    stroke="#BFA7FF"
    stroke-width="16"
    stroke-linecap="round"
    opacity="0.32"
    filter="url(#microGlow)"
  />

  <!-- Violet lava veins inside C -->
  <path d="M278 510 C360 475 405 394 480 377 C558 359 612 283 699 258" stroke="#A855F7" stroke-width="10" stroke-linecap="round" opacity="0.72" filter="url(#microGlow)"/>
  <path d="M240 620 C334 590 421 625 501 717 C556 781 643 768 724 714" stroke="#7C3AED" stroke-width="11" stroke-linecap="round" opacity="0.68" filter="url(#microGlow)"/>
  <path d="M337 271 C361 338 318 380 262 420" stroke="#C4B5FD" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#microGlow)"/>
  <path d="M512 827 C542 777 548 721 614 692" stroke="#C084FC" stroke-width="8" stroke-linecap="round" opacity="0.55" filter="url(#microGlow)"/>

  <!-- Centered North-star / crystal core -->
  <g filter="url(#softGlow)">
    <path
      d="M512 272
         C548 405 619 476 752 512
         C619 548 548 619 512 752
         C476 619 405 548 272 512
         C405 476 476 405 512 272Z"
      fill="url(#violetCore)"
      stroke="#EDE9FE"
      stroke-width="8"
      stroke-linejoin="round"
    />
    <path
      d="M512 337
         C535 426 586 489 687 512
         C586 535 535 598 512 687
         C489 598 438 535 337 512
         C438 489 489 426 512 337Z"
      fill="#2E1065"
      opacity="0.42"
    />
    <path d="M512 290 L512 734" stroke="#FFFFFF" stroke-width="4" opacity="0.35"/>
    <path d="M290 512 L734 512" stroke="#FFFFFF" stroke-width="4" opacity="0.35"/>
  </g>
</svg>
